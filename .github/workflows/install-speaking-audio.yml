name: Publish IELTSquirrel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Apply phone update when uploaded
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile

          archive = Path('IELTSquirrel_Phone_Update.zip')
          if not archive.exists():
              print('No phone update archive; publishing repository files.')
          else:
              with zipfile.ZipFile(archive) as bundle:
                  manifest = json.loads(bundle.read('site-update-manifest.json'))
                  if manifest.get('version') not in {'v123-clean-splash', 'v124-batch2', 'v125-branded-splash', 'v126-batch3', 'v127-batch4', 'v128-batch5', 'v129-simple-part1'}:
                      raise SystemExit('Incorrect phone update version')
                  expected = manifest['files']
                  present = set(bundle.namelist()) - {'site-update-manifest.json'}
                  if set(expected) != present:
                      raise SystemExit('Update archive has missing or unexpected files')
                  payload = {}
                  for name, digest in expected.items():
                      path = PurePosixPath(name)
                      if len(path.parts) != 1 or name.startswith('.') or path.suffix not in {'.html', '.png', '.webmanifest', '.js', '.json'}:
                          raise SystemExit('Unsafe update path: ' + name)
                      data = bundle.read(name)
                      if hashlib.sha256(data).hexdigest() != digest:
                          raise SystemExit('Corrupt update file: ' + name)
                      payload[name] = data
                  removals = manifest['remove']
                  if len(removals) != len(set(removals)):
                      raise SystemExit('Duplicate removal')
                  for name in removals:
                      path = PurePosixPath(name)
                      if len(path.parts) != 1 or name.startswith('.') or name in payload or not name.startswith(('IELTSquirrel_v', 'app-icon-', 'manifest-', 'HUONG-DAN-', 'AUDIO-', 'PART2-', 'speaking-practice-audio-manifest', 'squirrel-logo', 'alien-logo', 'install-speaking-audio')):
                          raise SystemExit('Unsafe removal: ' + name)
                  audio_payload = {}
                  audio_archives = []
                  if manifest['version'] in {'v124-batch2', 'v125-branded-splash', 'v126-batch3', 'v127-batch4', 'v128-batch5'}:
                      batch = {'v128-batch5': 5, 'v127-batch4': 4, 'v126-batch3': 3}.get(manifest['version'], 2)
                      start = (batch - 1) * 200 + 1
                      expected_audio = manifest['audio_files']
                      required_audio = {f'audio/speaking-practice/practice-{n:04d}.mp3' for n in range(start, start + 200)}
                      if set(expected_audio) != required_audio:
                          raise SystemExit(f'Batch {batch} must contain exactly answers {start}-{start + 199}')
                      names = manifest['audio_archives']
                      if names != [f'IELTSquirrel_Batch{batch}_Audio_1.zip', f'IELTSquirrel_Batch{batch}_Audio_2.zip']:
                          raise SystemExit('Unexpected audio archive names')
                      for archive_name in names:
                          audio_archive = Path(archive_name)
                          if not audio_archive.is_file():
                              raise SystemExit('Upload all three update ZIP files together. Missing: ' + archive_name)
                          audio_archives.append(audio_archive)
                          with zipfile.ZipFile(audio_archive) as audio_bundle:
                              for name in audio_bundle.namelist():
                                  if name not in required_audio or name in audio_payload:
                                      raise SystemExit('Unexpected or duplicate audio: ' + name)
                                  data = audio_bundle.read(name)
                                  if hashlib.sha256(data).hexdigest() != expected_audio[name]:
                                      raise SystemExit('Corrupt audio file: ' + name)
                                  audio_payload[name] = data
                      if set(audio_payload) != required_audio:
                          raise SystemExit(f'Incomplete Batch {batch} audio')
                      for n in range(1, start):
                          if not Path(f'audio/speaking-practice/practice-{n:04d}.mp3').is_file():
                              raise SystemExit(f'Install earlier batches before this update; missing answer {n}')
                  for name, data in audio_payload.items():
                      target = Path(name)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(data)
                  for name, data in payload.items():
                      Path(name).write_bytes(data)
                  for name in removals:
                      path = Path(name)
                      if path.is_file():
                          path.unlink()
                  for audio_archive in audio_archives:
                      audio_archive.unlink()
                  archive.unlink()
                  print(f'Installed {len(payload)} site files; removed obsolete files.')
          PYTHON

      - name: Save update to the repository
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update IELTSquirrel site and Speaking Practice audio"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi

      - name: Stage website for Pages
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json, os, shutil

          root = Path.cwd()
          manifest = json.loads((root/'manifest.webmanifest').read_text())
          essential = ['index.html', 'app.css', 'app-runtime.js', 'router.js', 'pwa.js', 'sw.js', 'CNAME', '.nojekyll']
          essential += [item['src'] for item in manifest['icons']]
          for name in essential:
              if not (root/name).is_file():
                  raise SystemExit('Missing website file: ' + name)
          out = Path(os.environ['RUNNER_TEMP'])/'ieltsquirrel-pages'
          out.mkdir()
          allowed = {'.html', '.js', '.css', '.json', '.webmanifest', '.png', '.svg', '.txt', '.xml'}
          for path in root.iterdir():
              if path.is_file() and (path.suffix in allowed or path.name in {'CNAME', '.nojekyll'}):
                  shutil.copy2(path, out/path.name)
          for directory in ['audio', 'visuals']:
              shutil.copytree(root/directory, out/directory)
          print('Staged website with audio and learning visuals.')
          PYTHON

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ieltsquirrel-pages

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
