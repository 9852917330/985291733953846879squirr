name: Publish IELTSquirrel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply phone update
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json, zipfile

          archive = Path('IELTSquirrel_Phone_Update_v144.zip')
          if archive.exists():
              with zipfile.ZipFile(archive) as z:
                  names = z.namelist()
                  assert len(names) == len(set(names)), 'Duplicate ZIP entries'
                  m = json.loads(z.read('site-update-manifest.json'))
                  assert m['version'] == 'v144-full-review', 'Wrong update version'
                  expected, base = m['files'], m['base_files']
                  assert set(base) == set(expected), 'Invalid base manifest'
                  assert set(names) == set(expected) | {'site-update-manifest.json'}, 'Incomplete or unexpected files'
                  assert sum(i.file_size for i in z.infolist()) < 100 * 1024 * 1024, 'Update is too large'
                  payload = {}
                  for name, digest in expected.items():
                      p = PurePosixPath(name)
                      assert not p.is_absolute() and all(v not in {'.', '..'} and not v.startswith('.') for v in p.parts), 'Unsafe path'
                      assert str(p) == name and '\\' not in name, 'Unsafe path'
                      assert (len(p.parts) == 1 and p.suffix in {'.html', '.js', '.css', '.json', '.xml'}) or (p.parts[0] == 'audio' and p.suffix == '.mp3'), 'Unexpected file type'
                      assert z.getinfo(name).external_attr >> 16 & 0o170000 != 0o120000, 'Symlink is not allowed'
                      data = z.read(name)
                      assert hashlib.sha256(data).hexdigest() == digest, 'Corrupt file: ' + name
                      target = Path(name)
                      current = hashlib.sha256(target.read_bytes()).hexdigest() if target.is_file() else None
                      assert current in {base[name], digest}, 'Website changed since this update was prepared: ' + name
                      payload[name] = data
              for name, data in payload.items():
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              archive.unlink()
              print('Installed v144: content review, audio, accessibility and SEO.')
          PY
      - name: Save update
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Review IELTSquirrel content, audio and SEO"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Stage website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'ieltsquirrel-pages'
          out.mkdir()
          allowed = {'.html', '.js', '.css', '.json', '.webmanifest', '.png', '.svg', '.txt', '.xml'}
          for path in root.iterdir():
              if path.is_file() and (path.suffix in allowed or path.name in {'CNAME', '.nojekyll'}):
                  shutil.copy2(path, out / path.name)
          for directory in ['audio', 'visuals']:
              shutil.copytree(root / directory, out / directory)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ieltsquirrel-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
