name: Update IELTSquirrel v116

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Install v116 and recover existing Batch 1 audio
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path,PurePosixPath
          import hashlib,json,zipfile
          root=Path.cwd();archive=root/'IELTSquirrel_v116_Fix.zip';sha=lambda b:hashlib.sha256(b).hexdigest()
          if not archive.is_file():raise SystemExit('Upload IELTSquirrel_v116_Fix.zip to the repository root first.')
          with zipfile.ZipFile(archive) as z:
           manifest=json.loads(z.read('IELTSquirrel-update-manifest.json'))
           if manifest.get('version')!='v116-no-band':raise SystemExit('Wrong update version.')
           payload={}
           for entry in z.infolist():
            n=entry.filename
            if n=='IELTSquirrel-update-manifest.json':continue
            path=PurePosixPath(n)
            if path.is_absolute() or '..' in path.parts or n.startswith('.github/') or n not in manifest['files']:raise SystemExit('Unexpected update path: '+n)
            if entry.file_size>20_000_000:raise SystemExit('Oversized update entry: '+n)
            data=z.read(entry)
            if sha(data)!=manifest['files'][n]:raise SystemExit('Corrupt update file: '+n)
            payload[n]=data
          if set(payload)!=set(manifest['files']):raise SystemExit('Incomplete update archive.')
          index=root/'index.html'
          if not index.is_file() or sha(index.read_bytes()) not in manifest['allowed_index_sha256']:raise SystemExit('The current index.html contains newer or unknown changes. Stop and merge them before updating.')
          needed={n:h for n,h in manifest['audio_files'].items() if not (root/n).is_file() or sha((root/n).read_bytes())!=h}
          for name in manifest['audio_archives']:
           if not needed:break
           if Path(name).name!=name:raise SystemExit('Invalid audio archive name.')
           if not (root/name).is_file():continue
           with zipfile.ZipFile(root/name) as z:
            for n in list(needed):
             if n not in z.namelist():continue
             data=z.read(n)
             if sha(data)!=needed[n]:raise SystemExit('Corrupt audio in '+name+': '+n)
             payload[n]=data;del needed[n]
          if needed:raise SystemExit('Missing Speaking Practice audio. Keep IELTSquirrel_v115_Update_1.zip and IELTSquirrel_v115_Update_2.zip at the repository root, then rerun.')
          for n,data in payload.items():
           p=root/n
           if p.is_symlink() or any(q.is_symlink() for q in p.parents if q!=root):raise SystemExit('Unexpected symbolic link: '+n)
          # Check existing audio before writing anything.
          for n,h in manifest['deployment_files'].items():
           if n not in payload and (not (root/n).is_file() or sha((root/n).read_bytes())!=h):raise SystemExit('Missing or changed original website file: '+n)
          for n,data in payload.items():
           p=root/n;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Installed v116: no band estimates, 4188 English meanings, 1026 audio files verified.')
          PYTHON
      - name: Verify and prepare the whole website
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import json,os,shutil,zipfile,hashlib
          root=Path.cwd()
          with zipfile.ZipFile('IELTSquirrel_v116_Fix.zip') as z:manifest=json.loads(z.read('IELTSquirrel-update-manifest.json'))
          out=Path(os.environ['RUNNER_TEMP'])/'ieltsquirrel-pages'
          out.mkdir(exist_ok=True)
          for name,expected in manifest['deployment_files'].items():
           source=root/name
           if not source.is_file() or hashlib.sha256(source.read_bytes()).hexdigest()!=expected:raise SystemExit('Missing or changed file: '+name)
           target=out/name;target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
          print('Verified all website files and all 1026 audio files.')
          PYTHON
      - name: Save updated website
        run: |
          git add -- '*.html' '*.js' '*.css' '*.json' '*.webmanifest' '*.png' '*.svg' robots.txt sitemap.xml CNAME .nojekyll audio/speaking-practice visuals
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update IELTSquirrel v116: remove band estimates and install complete meanings"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ieltsquirrel-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public website is actually v116
        run: |
          python3 - <<'PYTHON'
          import os,time,json,urllib.request
          expected='2026.10.12-v116-no-band'
          for attempt in range(12):
           try:
            stamp=str(time.time_ns())
            def get(path):
             req=urllib.request.Request('https://ieltsquirrel.com/'+path+'?verify='+stamp,headers={'Cache-Control':'no-cache','User-Agent':'IELTSquirrel-deployment-check'})
             with urllib.request.urlopen(req,timeout=20) as response:return response.read().decode('utf-8')
            status=json.loads(get('version.json'))
            page=get('')
            if status.get('version')==expected and expected in page:
             print('Verified live website:',expected)
             with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('## Website verified\n\nLive version: **'+expected+'**\n\n- Band estimates removed\n- 4,188 English phrase meanings\n- 200 Speaking Practice audio answers\n\nhttps://ieltsquirrel.com/\n')
             break
            print('Waiting for the new public version; found:',status.get('version','unknown'))
           except Exception as exc:print('Public verification pending:',type(exc).__name__)
           if attempt==11:raise SystemExit('Deployment ran, but the public domain has not been verified as v116. Check Pages Source = GitHub Actions and the custom domain. Do not treat this as a completed website update.')
           time.sleep(10)
          PYTHON
