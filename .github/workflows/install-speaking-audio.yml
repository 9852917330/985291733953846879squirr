name: Install IELTSquirrel speaking audio

on:
  push:
    paths:
      - 'speaking-qa-*.zip'
      - 'speaking-part2-*.zip'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: speaking-audio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Extract speaking audio
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import re
          import shutil

          archives = sorted([
              *Path('.').glob('speaking-qa-*.zip'),
              *Path('.').glob('speaking-part2-*.zip'),
          ])
          installed = 0
          for archive in archives:
              with ZipFile(archive) as bundle:
                  for entry in bundle.infolist():
                      if entry.is_dir():
                          continue
                      path = Path(entry.filename)
                      qa = (
                          len(path.parts) == 4
                          and path.parts[:3] == ('audio', 'ava-us', 'qa')
                          and re.fullmatch(r'speaking-part-[13]-\d+-q\d+\.mp3', path.name)
                      )
                      part2 = (
                          len(path.parts) == 3
                          and path.parts[:2] == ('audio', 'ava-us')
                          and re.fullmatch(r'speaking-part-2-(?:core-)?\d+\.mp3', path.name)
                      )
                      if not (qa or part2):
                          raise ValueError(f'Unexpected file: {entry.filename}')
                      path.parent.mkdir(parents=True, exist_ok=True)
                      with bundle.open(entry) as source, path.open('wb') as target:
                          shutil.copyfileobj(source, target)
                      installed += 1
              archive.unlink()
          print(f'Installed {installed} MP3 files from {len(archives)} archives.')
          PY

      - name: Commit audio files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install Speaking audio files"
          git push origin HEAD:"${GITHUB_REF_NAME}"
