name: Publish IELTSquirrel

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply phone update
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, zipfile
          archive = Path('IELTSquirrel_Phone_Update_Batch3.zip')
          if archive.exists():
              names = ['IELTSquirrel_Practice_Simple_Batch3_Audio_1.zip', 'IELTSquirrel_Practice_Simple_Batch3_Audio_2.zip']
              with zipfile.ZipFile(archive) as z:
                  manifest = json.loads(z.read('site-update-manifest.json'))
              site = {'speaking-practice-audio-data.js', 'pwa.js', 'sw.js', 'version.json'}
              audio = {f'audio/simple/speaking-practice/practice-{n:04d}.mp3' for n in range(501, 751)}
              assert manifest['version'] == 'v142-practice-simple-audio-batch3', 'Incorrect update version'
              assert set(manifest['files']) == site and set(manifest['audio_files']) == audio, 'Incorrect update coverage'
              assert manifest['audio_archives'] == names, 'Incorrect audio archives'
              expected = {**manifest['files'], **manifest['audio_files']}
              payload = {}
              for filename in [archive.name] + names:
                  assert Path(filename).is_file(), 'Upload all three ZIP files. Missing: ' + filename
                  with zipfile.ZipFile(filename) as z:
                      assert len(z.namelist()) == len(set(z.namelist())), 'Duplicate ZIP entries'
                      for name in z.namelist():
                          if filename == archive.name and name == 'site-update-manifest.json':
                              continue
                          assert name in expected and name not in payload, 'Unexpected file: ' + name
                          data = z.read(name)
                          assert hashlib.sha256(data).hexdigest() == expected[name], 'Corrupt file: ' + name
                          payload[name] = data
              assert set(payload) == set(expected), 'Incomplete update'
              for name in site:
                  target = Path(name)
                  assert target.is_file(), 'Missing original file: ' + name
                  current = hashlib.sha256(target.read_bytes()).hexdigest()
                  assert current in {manifest['base_files'][name], expected[name]}, 'Website changed since this update was prepared: ' + name
              for name, data in payload.items():
                  target = Path(name)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
              for filename in [archive.name] + names:
                  Path(filename).unlink()
              print('Installed Speaking Practice Simple audio 501-750.')
          PY
      - name: Save update
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add Speaking Practice Simple audio batch 3"
            git push origin "HEAD:${{ github.event.repository.default_branch }}"
          fi
      - name: Stage website
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, shutil
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / 'ieltsquirrel-pages'
          out.mkdir()
          allowed = {'.html', '.js', '.css', '.json', '.webmanifest', '.png', '.svg', '.txt', '.xml'}
          for path in root.iterdir():
              if path.is_file() and (path.suffix in allowed or path.name in {'CNAME', '.nojekyll'}):
                  shutil.copy2(path, out / path.name)
          for directory in ['audio', 'visuals']:
              shutil.copytree(root / directory, out / directory)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ieltsquirrel-pages
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
